services:

  php:
    build:
      context: ./php
    container_name: asd_php
    volumes:
      - ../backend:/var/www/html
    working_dir: /var/www/html
    ports:
      - "9000:9000"
    depends_on:
      - mysql


  nginx:
    image: nginx:latest
    container_name: asd_nginx
    ports:
      - "8080:80"
    volumes:
      - ../backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php


  mysql:
    image: mysql:8.4
    container_name: asd_mysql
    restart: always
    environment:
      MYSQL_DATABASE: asd_work_assistant
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql


  node:
    image: node:22
    container_name: asd_node
    volumes:
      - ../frontend:/app
      - node_modules:/app/node_modules
    working_dir: /app
    ports:
      - "5173:5173"
    command: npm run dev -- --host


volumes:

  mysql_data:

  node_modules: